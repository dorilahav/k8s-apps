# One Argo app per morti PR preview: morti's .github/workflows/preview.yml
# writes morti-previews/pr-<n>.yaml and removes it when the PR closes or turns
# draft (or preview-janitor.yml does). A removed file deletes the app; the
# finalizer prunes its resources and the chart's PostDelete Job empties the
# morti-pr-<n> database.
#
# root-app renders this file with Helm, so every ApplicationSet expression is
# escaped ({{`{{ ... }}`}}) to reach Argo verbatim.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: morti-previews
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/dorilahav/k8s-apps.git
      revision: HEAD
      files:
      - path: morti-previews/pr-*.yaml
  template:
    metadata:
      name: morti-pr-{{`{{ .pr }}`}}
      finalizers:
      - resources-finalizer.argocd.argoproj.io
    spec:
      project: apps
      sources:
      - repoURL: https://github.com/dorilahav/k8s-apps.git
        path: charts/morti
        targetRevision: HEAD
        helm:
          valueFiles:
          - $values/morti-previews/defaults.yaml
          # The per-PR values are copied into the Application itself rather than
          # read from pr-<n>.yaml: the app is deleted *because* that file left git,
          # and ArgoCD renders the chart again at deletion to find the PostDelete
          # cleanup Job. Rendered from the missing file, that fails, the hook is
          # never created and the morti-pr-<n> database is left behind.
          parameters:
          - name: route.host
            value: '{{`{{ .route.host }}`}}'
            forceString: true
          - name: leads.image
            value: '{{`{{ .leads.image }}`}}'
            forceString: true
          - name: api.image
            value: '{{`{{ .api.image }}`}}'
            forceString: true
          - name: api.env.MONGODB_DB_NAME
            value: '{{`{{ .api.env.MONGODB_DB_NAME }}`}}'
            forceString: true
          - name: api.env.CORS_ORIGIN
            value: '{{`{{ .api.env.CORS_ORIGIN }}`}}'
            forceString: true
      - repoURL: https://github.com/dorilahav/k8s-apps.git
        targetRevision: HEAD
        ref: values
      destination:
        server: https://kubernetes.default.svc
        # Shared by all previews: the chart names everything after the release
        # (the app name), and the one hand-made morti-api-config secret lives here.
        namespace: morti-previews
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        automated:
          selfHeal: true
          prune: true
