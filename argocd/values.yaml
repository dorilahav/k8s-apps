dex:
  enabled: false
notifications:
  enabled: false

global:
  domain: argocd.dorilahav.com

configs:
  params:
    server.insecure: true
  cm:
    resource.customizations: |
      networking.k8s.io/Ingress:
        health.lua: |
          hs = {}
          hs.status = "Healthy"
          hs.message = "Probably just fine"
          return hs

server:
  ingress:
    enabled: true
    ingressClassName: "nginx"
    tls: false

# The ApplicationSet controller serves its own webhook (port 7000); the one on
# argocd-server only refreshes existing Applications. Without this, a new
# morti-previews/pr-<n>.yaml waits for the controller's next poll. k8s-apps has
# a second GitHub webhook (push, same secret) pointing here. Its own host: the
# NGINX Inc controller rejects a second Ingress for argocd.dorilahav.com.
applicationSet:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd-appset.dorilahav.com
