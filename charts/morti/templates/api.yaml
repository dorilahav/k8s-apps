{{- $name := include "morti.apiName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ .Values.api.replicaCount | default 1 }}
  {{- with .Values.api.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
      - name: api
        image: {{ required ".Values.api.image is required" .Values.api.image }}
        ports:
        - name: http
          containerPort: 3333
        env:
        - name: PORT
          value: "3333"
        {{- range $key, $value := .Values.api.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        # MONGODB_URI, CORS_ORIGIN, ATTIO_* - created by hand, never committed.
        envFrom:
        - secretRef:
            name: {{ required ".Values.api.envSecretName is required" .Values.api.envSecretName }}
        # /api/health answers 503 while MongoDB is unreachable: that takes the
        # pod out of the Service, but only a dead process restarts it.
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
