{{- $name := include "morti.leadsName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ .Values.leads.replicaCount | default 1 }}
  {{- with .Values.leads.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
      - name: leads
        image: {{ required ".Values.leads.image is required" .Values.leads.image }}
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        # Server to server (proxy.ts creates visitor sessions), so it skips the ingress.
        - name: API_INTERNAL_URL
          value: http://{{ include "morti.apiName" . }}/api
        {{- range $key, $value := .Values.leads.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          {{- toYaml .Values.leads.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
