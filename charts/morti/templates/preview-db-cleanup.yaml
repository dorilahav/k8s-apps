{{- /*
  PR previews only: morti-previews/defaults.yaml turns it on. When ArgoCD
  deletes a morti-pr-<n> app (its values file left k8s-apps), this PostDelete
  hook empties that preview's own database. It drops the collections rather
  than the database, so the Mongo user only needs readWrite; an empty database
  disappears on its own. Guarded twice so it can never touch staging or
  production data.
*/ -}}
{{- if .Values.previewDbCleanup.enabled }}
{{- $db := required "api.env.MONGODB_DB_NAME is required when previewDbCleanup is enabled" .Values.api.env.MONGODB_DB_NAME }}
{{- if not (regexMatch "^morti-pr-[0-9]+$" $db) }}
{{- fail (printf "previewDbCleanup only empties morti-pr-<n> databases, not %q" $db) }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-drop-db
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: drop-db
        # The preview's own api image: already on the node, and mongoose is in
        # its /app/node_modules.
        image: {{ required ".Values.api.image is required" .Values.api.image }}
        # MONGODB_URI
        envFrom:
        - secretRef:
            name: {{ required ".Values.api.envSecretName is required" .Values.api.envSecretName }}
        env:
        - name: MONGODB_DB_NAME
          value: {{ $db | quote }}
        command:
        - node
        - -e
        - |
          const mongoose = require('mongoose');
          const dbName = process.env.MONGODB_DB_NAME;
          (async () => {
            if (!/^morti-pr-\d+$/.test(dbName)) throw new Error(`refusing to empty ${dbName}`);
            await mongoose.connect(process.env.MONGODB_URI, { dbName, serverSelectionTimeoutMS: 10000 });
            const db = mongoose.connection.db;
            const collections = await db.listCollections({}, { nameOnly: true }).toArray();
            for (const { name } of collections) {
              if (name.startsWith('system.')) continue;
              await db.dropCollection(name);
              console.log(`dropped ${dbName}.${name}`);
            }
            console.log(`emptied ${dbName}`);
            await mongoose.disconnect();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
{{- end }}
