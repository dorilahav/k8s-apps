# Defaults; each environment overrides them in morti-<env>/values.yaml.
route:
  host: ""

leads:
  image: ""
  replicaCount: 1
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  image: ""
  replicaCount: 1
  envSecretName: morti-api-config
  env: {}
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

# PR previews only (morti-previews/defaults.yaml): empty the preview's
# morti-pr-<n> database when ArgoCD deletes its app.
previewDbCleanup:
  enabled: false
