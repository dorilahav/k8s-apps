# Shared values for every PR preview. The per-PR files, morti-previews/pr-<n>.yaml
# (host, images, MONGODB_DB_NAME, CORS_ORIGIN), are written and removed by
# morti's .github/workflows/preview.yml and preview-janitor.yml. The
# ApplicationSet in apps/templates/morti-previews-appset.yaml turns each into
# the Argo app morti-pr-<n>, passing its values as Helm parameters on top of
# this file. Those files are generator input only, never a Helm values file.
#
# The cluster is small: requests are minimal, and Recreate means a rollout
# never needs a surge pod that the morti-previews ResourceQuota cannot fit.
# Tune with `kubectl top pod -n morti-previews`.

leads:
  strategy:
    type: Recreate
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 320Mi

api:
  # Shared by every preview: MONGODB_URI only. The database name comes from
  # each preview's api.env.MONGODB_DB_NAME.
  envSecretName: morti-api-config
  strategy:
    type: Recreate
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi

previewDbCleanup:
  enabled: true
